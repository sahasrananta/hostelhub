version: "3.8"

services:
  hostelhub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostelhub-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=d7dedf26c7175409d3d7121a011fbf1efd85c0c8c57722b4ce779d18fddc7115
      - ALLOWED_ORIGINS=*
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=5
    volumes:
      # Persist SQLite database and uploaded media outside container
      - hostelhub-data:/app/backend/uploads
      - hostelhub-db:/app/backend

volumes:
  hostelhub-data:
  hostelhub-db:
